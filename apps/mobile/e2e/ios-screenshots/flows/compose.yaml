appId: com.savingroup.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      SAVINGROUP_ACTIVE_EMAIL: ${SAVINGROUP_SCREENSHOT_EMAIL}
- openLink: "savingroup:///new"
- extendedWaitUntil:
    visible: "Name this bot"
    timeout: 15000
- takeScreenshot: 01-new-bot
- tapOn: "Cancel"
- openLink: "savingroup:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "savingroup:///new-group"
- extendedWaitUntil:
    visible: "Name this group"
    timeout: 15000
- takeScreenshot: 03-new-group
- openLink: "savingroup:///"
