[project]
name = "savingroup_business_bridge"
authors = [{ name = "Savingroup contributors" }]
description = "Savingroup native business gateway bridge for ERPNext and Frappe CRM"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"
